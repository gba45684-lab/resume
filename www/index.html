<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f6efe3">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>ResuMate — Resume Builder</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/ui-fixes.css">
<link rel="stylesheet" href="css/home-responsive-fix.css">
<link rel="stylesheet" href="css/home-fixed-viewport.css">
<link rel="stylesheet" href="css/templates-scroll-fix.css">
<link rel="stylesheet" href="css/premium-polish.css">
<link rel="stylesheet" href="css/premium-template-gallery.css">
<script>window.__RESUMATE_BUILD__ = 0;</script>
<script src="js/ota-bootstrap.js"></script>
</head>
<body data-ota="github-branch">
<div class="app-shell">
  <header class="app-header">
    <button id="headerBack" class="header-icon hidden" aria-label="Back">‹</button>
    <div class="brand-lockup">
      <div class="brand-title">ResuMate</div>
    </div>
    <button id="premiumBtn" class="premium-chip" aria-label="Premium">♛ <span>PREMIUM</span></button>
  </header>
  <main id="screenRoot" class="screen-root">
    <section id="homeScreen" class="screen active"></section>
    <section id="templatesScreen" class="screen"></section>
    <section id="templateDetailScreen" class="screen"></section>
    <section id="editorScreen" class="screen"></section>
    <section id="myResumesScreen" class="screen"></section>
    <section id="aiScreen" class="screen"></section>
    <section id="suggestionsScreen" class="screen"></section>
    <section id="premiumScreen" class="screen"></section>
    <section id="profileScreen" class="screen"></section>
  </main>
  <nav class="bottom-nav" aria-label="Primary">
    <button data-nav="home" class="nav-item active"><span>⌂</span><b>Home</b></button>
    <button data-nav="templates" class="nav-item"><span>▦</span><b>Templates</b></button>
    <button data-nav="ai" class="nav-item"><span>✦</span><b>AI Assistant</b></button>
    <button data-nav="profile" class="nav-item"><span>♙</span><b>Profile</b></button>
  </nav>
</div>
<div id="toast" class="toast"></div>
<input id="importFile" type="file" accept=".json,.txt,.html,.htm" hidden>
<script src="js/templates.js"></script>
<script src="js/app.js"></script>
<script src="js/ui-integrity.js"></script>
<script src="js/editor-live.js"></script>
<script src="js/native-enhancements.js"></script>
<script src="js/template-direct-preview.js"></script>
<script src="js/preview-fullscreen-controls.js"></script>
<script src="js/template-label-integrity.js"></script>
<script src="js/template-filters-search-fix.js"></script>
<script src="js/screen-layout-fix.js"></script>
<script src="js/premium-template-gallery.js"></script>
</body>
</html>
