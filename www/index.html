<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>Resume — 100 Templates</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">
<header class="topbar"><div class="brand">Resume</div><div class="top-actions"><button id="templatesBtn" class="ghost">Templates <span>100</span></button><button id="previewBtn" class="ghost">Preview</button><button id="pdfBtn" class="primary">Export PDF</button></div></header>
<main class="workspace">
<section class="editor-panel"><div class="section-title"><div><h1>Edit resume</h1><p>Content only. Template design is locked.</p></div><span id="saveState">Saved</span></div>
<form id="resumeForm" autocomplete="off">
<section class="form-section"><h2>Personal</h2><div class="grid"><label>Full name<input data-path="personal.name" placeholder="Your name"></label><label>Professional title<input data-path="personal.title" placeholder="Product Manager"></label><label>Email<input data-path="personal.email" type="email" placeholder="name@email.com"></label><label>Phone<input data-path="personal.phone" placeholder="+91 98765 43210"></label><label>Location<input data-path="personal.location" placeholder="New Delhi, India"></label><label>Website / LinkedIn<input data-path="personal.website" placeholder="linkedin.com/in/yourname"></label></div><label>Photo URL (optional)<input data-path="personal.photo" placeholder="https://..."></label></section>
<section class="form-section"><h2>Summary</h2><textarea data-path="summary" rows="4" placeholder="A concise professional summary..."></textarea></section>
<section class="form-section"><div class="row-head"><h2>Experience</h2><button type="button" class="small" data-add="experience">+ Add</button></div><div id="experienceFields"></div></section>
<section class="form-section"><div class="row-head"><h2>Education</h2><button type="button" class="small" data-add="education">+ Add</button></div><div id="educationFields"></div></section>
<section class="form-section"><h2>Skills</h2><textarea data-path="skills" rows="3" placeholder="JavaScript, Excel, Communication, Leadership"></textarea></section>
<section class="form-section"><h2>Projects</h2><textarea data-path="projects" rows="4" placeholder="Project name — what you built and the result"></textarea></section>
<section class="form-section"><h2>Certifications & other</h2><textarea data-path="certifications" rows="3" placeholder="Certification — Issuer — Year"></textarea></section>
</form></section>
<section class="preview-panel"><div class="preview-head"><strong id="templateName">Template 01</strong><button id="closePreview" class="ghost mobile-only">Edit</button></div><div class="paper-wrap"><article id="resumePaper" class="resume-paper"></article></div></section>
</main></div>
<div id="templateSheet" class="sheet hidden"><div class="sheet-card"><div class="sheet-head"><h2>Choose template</h2><button id="closeTemplates" class="ghost">Close</button></div><div id="templateGrid" class="template-grid"></div></div></div>
<script src="js/templates.js"></script><script src="js/app.js"></script>
</body></html>
