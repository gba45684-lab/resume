name: Build signed AAB

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Decode release keystore
        if: secrets.RELEASE_KEYSTORE_BASE64 != ''
        run: |
          echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > release.jks

      - name: Build release AAB
        working-directory: android
        env:
          RELEASE_KEYSTORE_PATH: ${{ github.workspace }}/release.jks
        run: |
          ./gradlew bundleRelease -PreleaseStorePassword="$RELEASE_STORE_PASSWORD" -PreleaseKeyAlias="$RELEASE_KEY_ALIAS" -PreleaseKeyPassword="$RELEASE_KEY_PASSWORD" -PRELEASE_KEYSTORE_PATH="$RELEASE_KEYSTORE_PATH"

      - name: Upload signed AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: resumeforge-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
