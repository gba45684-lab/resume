name: Publish OTA update

# ResuMate1-style OTA: publish only www/index.html + version.json to the ota branch.
on:
  push:
    branches: [main]
    paths:
      - 'www/index.html'
      - 'www/js/**'
      - 'www/css/**'
      - 'scripts/**'
      - '.github/workflows/publish-ota.yml'
  workflow_dispatch: {}

concurrency:
  group: publish-ota
  cancel-in-progress: false

permissions:
  contents: write

env:
  OTA_OUT: ${{ github.workspace }}/ota-out

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Determine next build number
        id: build
        run: |
          set -euo pipefail
          PREV=0
          if git ls-remote --exit-code --heads origin ota >/dev/null 2>&1; then
            git fetch origin ota --depth 1
            PREV=$(git show origin/ota:version.json 2>/dev/null | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>{try{console.log(JSON.parse(d).build||0)}catch(e){console.log(0)}})")
          fi
          NEXT=$((PREV + 1))
          echo "previous=$PREV" >> "$GITHUB_OUTPUT"
          echo "next=$NEXT" >> "$GITHUB_OUTPUT"
          echo "Previous published build: $PREV -> publishing build: $NEXT"

      - name: Full project audit
        run: node scripts/audit-project.mjs

      - name: Prepare OTA payload
        run: |
          set -euo pipefail
          rm -rf "$OTA_OUT"
          node scripts/publish-ota.mjs "${{ steps.build.outputs.next }}" "$OTA_OUT"
          test -s "$OTA_OUT/index.html"
          test -s "$OTA_OUT/version.json"
          echo "OTA payload verified at $OTA_OUT"
          ls -la "$OTA_OUT"

      - name: Publish to ota branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -d "$OTA_OUT"
          test -s "$OTA_OUT/index.html"
          test -s "$OTA_OUT/version.json"
          cd "$OTA_OUT"
          git init -q
          git config user.name "resumate-ota-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html version.json
          git commit -q -m "OTA build ${{ steps.build.outputs.next }} (from ${{ github.sha }})"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          git push --force origin HEAD:ota

      - name: Summary
        run: |
          echo "### OTA build ${{ steps.build.outputs.next }} published" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Manifest: https://raw.githubusercontent.com/${{ github.repository }}/ota/version.json" >> "$GITHUB_STEP_SUMMARY"
          echo "- Bundle: https://raw.githubusercontent.com/${{ github.repository }}/ota/index.html" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Installed OTA-enabled apps will pick this up automatically on their next launch." >> "$GITHUB_STEP_SUMMARY"
