name: Publish OTA update

# ResuMate-style OTA: publish only www/index.html + version.json to the ota branch.
on:
  push:
    branches: [main]
    paths:
      - 'www/index.html'
      - 'www/js/**'
      - 'www/css/**'
      - 'scripts/**'
      - '.github/workflows/publish-ota.yml'
  workflow_dispatch: {}

concurrency:
  group: publish-ota
  cancel-in-progress: false

permissions:
  contents: write

env:
  OTA_OUT: ${{ github.workspace }}/ota-out
  OTA_GIT: ${{ github.workspace }}/ota-publish

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Determine next build number
        id: build
        run: |
          set -euo pipefail
          PREV=0
          if git ls-remote --exit-code --heads origin ota >/dev/null 2>&1; then
            git fetch origin ota --depth 1
            PREV=$(git show origin/ota:version.json 2>/dev/null | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>{try{console.log(JSON.parse(d).build||0)}catch(e){console.log(0)}})")
          fi
          NEXT=$((PREV + 1))
          echo "previous=$PREV" >> "$GITHUB_OUTPUT"
          echo "next=$NEXT" >> "$GITHUB_OUTPUT"
          echo "Previous published build: $PREV -> publishing build: $NEXT"

      - name: Full project audit
        run: node scripts/audit-project.mjs

      - name: Build and publish OTA
        run: |
          set -euo pipefail

          rm -rf "$OTA_OUT" "$OTA_GIT"
          mkdir -p "$OTA_OUT"

          echo "[OTA] Generating build ${{ steps.build.outputs.next }}"
          node scripts/publish-ota.mjs "${{ steps.build.outputs.next }}" "$OTA_OUT"

          test -s "$OTA_OUT/index.html"
          test -s "$OTA_OUT/version.json"
          echo "[OTA] Generated payload:"
          ls -lh "$OTA_OUT/index.html" "$OTA_OUT/version.json"

          echo "[OTA] Cloning existing ota branch"
          AUTH_HEADER=$(git -C "$GITHUB_WORKSPACE" config --local --get http.https://github.com/.extraheader)
          test -n "$AUTH_HEADER"
          git -c http.https://github.com/.extraheader="$AUTH_HEADER" clone --depth 1 --branch ota "https://github.com/${{ github.repository }}.git" "$OTA_GIT"

          cp "$OTA_OUT/index.html" "$OTA_GIT/index.html"
          cp "$OTA_OUT/version.json" "$OTA_GIT/version.json"

          cd "$OTA_GIT"
          git config user.name "resumate-ota-bot"
          git config user.email "actions@users.noreply.github.com"
          git config commit.gpgSign false

          git add -- index.html version.json

          echo "[OTA] Staged files:"
          git status --short

          test "$(git diff --cached --name-only | wc -l)" -eq 2
          git diff --cached --name-only | grep -Fxq 'index.html'
          git diff --cached --name-only | grep -Fxq 'version.json'

          echo "[OTA] Committing build ${{ steps.build.outputs.next }}"
          git commit --no-gpg-sign -m "OTA build ${{ steps.build.outputs.next }} (from ${{ github.sha }})"

          echo "[OTA] Pushing ota branch"
          git -c http.https://github.com/.extraheader="$AUTH_HEADER" push origin HEAD:ota

      - name: Verify published OTA
        run: |
          set -euo pipefail
          git fetch origin ota --depth 1
          PUBLISHED_BUILD=$(git show origin/ota:version.json | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>{const v=JSON.parse(d); console.log(v.build)})")
          EXPECTED_BUILD="${{ steps.build.outputs.next }}"
          test "$PUBLISHED_BUILD" = "$EXPECTED_BUILD"
          test "$(git show origin/ota:index.html | grep -F -c 'window.__RESUMATE_OTA_PAYLOAD__ = true')" -eq 1
          echo "OTA publication verified: build $PUBLISHED_BUILD"

      - name: Summary
        run: |
          echo "### OTA build ${{ steps.build.outputs.next }} published and verified" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Manifest: https://raw.githubusercontent.com/${{ github.repository }}/ota/version.json" >> "$GITHUB_STEP_SUMMARY"
          echo "- Bundle: https://raw.githubusercontent.com/${{ github.repository }}/ota/index.html" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Installed OTA-enabled apps will pick this up automatically on their next launch." >> "$GITHUB_STEP_SUMMARY"
