name: Capgo OTA

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: capgo-ota-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_ID: com.krapal.resumeforge
  CHANNEL: production

jobs:
  deploy:
    name: Deploy web-only changes to Capgo
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check Capgo configuration
        env:
          CAPGO_TOKEN: ${{ secrets.CAPGO_TOKEN }}
        run: |
          if [ -z "$CAPGO_TOKEN" ]; then
            echo "CAPGO_TOKEN is not configured; OTA cannot be published."
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify Capgo updater is installed
        run: |
          node -e "const p=require('./package.json'); if(!p.dependencies?.['@capgo/capacitor-updater'] && !p.devDependencies?.['@capgo/capacitor-updater']) { console.error('@capgo/capacitor-updater is missing from package.json'); process.exit(1) }; console.log('@capgo/capacitor-updater:', p.dependencies?.['@capgo/capacitor-updater'] || p.devDependencies?.['@capgo/capacitor-updater'])"

      - name: Check whether this commit is OTA-safe
        id: changes
        shell: bash
        run: |
          BEFORE="${{ github.event.before }}"
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then BEFORE="$(git rev-parse HEAD~1 2>/dev/null || true)"; fi
          if [ -z "$BEFORE" ]; then echo "native=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          if git diff --name-only "$BEFORE" "${{ github.sha }}" | grep -qE '^(android/|ios/|capacitor\.config\.|package\.json|package-lock\.json|\.github/workflows/)'; then
            echo "native=true" >> "$GITHUB_OUTPUT"
          else
            echo "native=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Stop for native changes
        if: steps.changes.outputs.native == 'true'
        run: echo "Native/package/CI changes detected; this commit requires a new APK."

      - name: Build web bundle
        if: steps.changes.outputs.native == 'false'
        run: |
          if npm run | grep -qE '^  build'; then npm run build; fi
          test -f www/index.html

      - name: Verify OTA compatibility
        if: steps.changes.outputs.native == 'false'
        env:
          CAPGO_TOKEN: ${{ secrets.CAPGO_TOKEN }}
        run: |
          TYPE="$(npx @capgo/cli@latest bundle releaseType "$APP_ID" --channel "$CHANNEL" --apikey "$CAPGO_TOKEN" | grep -E '^(OTA|native)$' | tail -n 1 | tr -d '[:space:]')"
          echo "Capgo release type: $TYPE"
          test "$TYPE" = "OTA"

      - name: Upload OTA bundle
        if: steps.changes.outputs.native == 'false'
        env:
          CAPGO_TOKEN: ${{ secrets.CAPGO_TOKEN }}
        run: |
          npx @capgo/cli@latest bundle upload "$APP_ID" --apikey "$CAPGO_TOKEN" --path ./www --channel "$CHANNEL" --fail-on-incompatible --auto-min-update-version --auto-bump patch --delta --tus --keep 5

      - name: Summary
        if: always()
        run: |
          echo "### Capgo OTA" >> "$GITHUB_STEP_SUMMARY"
          echo "App: $APP_ID" >> "$GITHUB_STEP_SUMMARY"
          echo "Channel: $CHANNEL" >> "$GITHUB_STEP_SUMMARY"
          echo "Native changes require APK; web-only changes use OTA." >> "$GITHUB_STEP_SUMMARY"
