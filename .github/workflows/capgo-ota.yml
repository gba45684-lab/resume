name: Capgo OTA

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: capgo-ota-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_ID: com.krapal.resumeforge
  CHANNEL: production

jobs:
  deploy:
    name: Deploy web-only changes to Capgo
    runs-on: ubuntu-latest
    if: ${{ secrets.CAPGO_TOKEN != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Check changed files
        id: changes
        shell: bash
        run: |
          BEFORE="${{ github.event.before }}"
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            BEFORE="$(git rev-parse HEAD~1 2>/dev/null || echo '')"
          fi
          if [ -z "$BEFORE" ]; then
            echo "native=true" >> "$GITHUB_OUTPUT"
            echo "No previous commit is available; refusing an automatic OTA."
            exit 0
          fi
          if git diff --name-only "$BEFORE" "${{ github.sha }}" | grep -qE '^(android/|capacitor\.config\.|package\.json|package-lock\.json|\.github/workflows/)'; then
            echo "native=true" >> "$GITHUB_OUTPUT"
            echo "Native/package/CI files changed. OTA deployment is blocked."
          else
            echo "native=false" >> "$GITHUB_OUTPUT"
            echo "Only web-layer changes detected."
          fi

      - name: Stop safely for native changes
        if: steps.changes.outputs.native == 'true'
        run: echo "Skipping Capgo OTA; a native APK/Play release is required for this change."

      - name: Verify OTA compatibility
        if: steps.changes.outputs.native == 'false'
        env:
          CAPGO_TOKEN: ${{ secrets.CAPGO_TOKEN }}
        run: |
          TYPE="$(npx @capgo/cli@latest bundle releaseType "$APP_ID" --channel "$CHANNEL" --apikey "$CAPGO_TOKEN" | tail -n 1 | tr -d '[:space:]')"
          echo "Capgo release type: $TYPE"
          test "$TYPE" = "OTA"

      - name: Upload guarded OTA bundle
        if: steps.changes.outputs.native == 'false'
        env:
          CAPGO_TOKEN: ${{ secrets.CAPGO_TOKEN }}
        run: |
          npx @capgo/cli@latest bundle upload "$APP_ID" \
            --apikey "$CAPGO_TOKEN" \
            --path ./www \
            --channel "$CHANNEL" \
            --fail-on-incompatible \
            --auto-min-update-version \
            --auto-bump patch \
            --delta \
            --tus \
            --keep 5

      - name: OTA deployment summary
        if: always()
        run: |
          echo "### Capgo OTA" >> "$GITHUB_STEP_SUMMARY"
          echo "App: $APP_ID" >> "$GITHUB_STEP_SUMMARY"
          echo "Channel: $CHANNEL" >> "$GITHUB_STEP_SUMMARY"
          echo "Automatic OTA is limited to compatible web-layer changes." >> "$GITHUB_STEP_SUMMARY"
