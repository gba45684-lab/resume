<script>window.__RESUMATE_BUILD__ = 64;</script>
<script data-ota-inline="js/ota-bootstrap.js">
/* ResuMate1-style GitHub-branch OTA bootstrap + long update alert. */
(() => {
  const CURRENT = Number(window.__RESUMATE_BUILD__ || 0);
  const IS_OTA_PAYLOAD = window.__RESUMATE_OTA_PAYLOAD__ === true;
  const KEY_HTML = 'resumate_ota_html_v2';
  const KEY_BUILD = 'resumate_ota_build_v2';
  const KEY_PREVIOUS = 'resumate_ota_previous_html_v2';
  const KEY_PENDING = 'resumate_ota_pending_v2';
  const KEY_ATTEMPT = 'resumate_ota_attempt_v2';
  const KEY_ALERTED = 'resumate_ota_alerted_build_v1';
  const BOOT_OK = 'resumate_ota_boot_ok_v2';
  const MANIFEST_URL = 'https://raw.githubusercontent.com/gba45684-lab/resume/ota/version.json';
  const BUILD_URL = 'https://raw.githubusercontent.com/gba45684-lab/resume/ota/index.html';

  if (IS_OTA_PAYLOAD) {
    window.__RESUMATE_OTA_READY__ = () => {
      try {
        sessionStorage.setItem(BOOT_OK, '1');
        localStorage.removeItem(KEY_PENDING);
        localStorage.removeItem(KEY_ATTEMPT);
        localStorage.removeItem(KEY_PREVIOUS);
      } catch {}
    };
    return;
  }

  try { sessionStorage.removeItem(BOOT_OK); } catch {}

  const digest = async text => {
    if (!globalThis.crypto?.subtle) return null;
    const bytes = new TextEncoder().encode(text);
    const hash = await globalThis.crypto.subtle.digest('SHA-256', bytes);
    return [...new Uint8Array(hash)].map(b => b.toString(16).padStart(2, '0')).join('');
  };

  const nativeAlert = async (method, args = {}) => {
    try {
      const plugin = globalThis.Capacitor?.Plugins?.ResuMateUpdateAlert;
      if (plugin?.[method]) {
        await plugin[method](args);
        return true;
      }
    } catch {}
    return false;
  };

  const showUpdateIndicator = build => {
    try {
      let bar = document.getElementById('resumate-ota-update-alert');
      if (!bar) {
        bar = document.createElement('div');
        bar.id = 'resumate-ota-update-alert';
        bar.setAttribute('role', 'status');
        bar.style.cssText = 'position:fixed;left:12px;right:12px;top:12px;z-index:2147483646;padding:13px 15px;border-radius:14px;background:#2f241d;color:#fff;box-shadow:0 10px 30px rgba(0,0,0,.24);font:700 14px/1.35 system-ui,sans-serif;text-align:center;';
        document.body.appendChild(bar);
      }
      bar.textContent = `ResuMate update ${build} found — updating in a few seconds…`;
    } catch {}
  };

  const alertForUpdate = async build => {
    try {
      if (Number(localStorage.getItem(KEY_ALERTED) || 0) === build) return;
      localStorage.setItem(KEY_ALERTED, String(build));
    } catch {}
    showUpdateIndicator(build);
    const native = await nativeAlert('ringUpdate', { build });
    if (!native) {
      try { navigator.vibrate?.([0, 350, 180, 350, 180, 700]); } catch {}
    }
  };

  const rollbackPending = () => {
    try {
      const pending = Number(localStorage.getItem(KEY_PENDING) || 0);
      const attempt = Number(localStorage.getItem(KEY_ATTEMPT) || 0);
      const previous = localStorage.getItem(KEY_PREVIOUS);
      if (!pending || !attempt || pending !== attempt || !previous) return false;
      localStorage.setItem(KEY_HTML, previous);
      localStorage.setItem(KEY_BUILD, String(Math.max(0, CURRENT)));
      localStorage.removeItem(KEY_PENDING);
      localStorage.removeItem(KEY_ATTEMPT);
      localStorage.removeItem(KEY_PREVIOUS);
      location.reload();
      return true;
    } catch {}
    return false;
  };

  const getCachedBuild = () => {
    try { return Number(localStorage.getItem(KEY_BUILD) || 0); } catch { return 0; }
  };

  const activateCached = () => {
    try {
      const html = localStorage.getItem(KEY_HTML);
      const build = getCachedBuild();
      if (!html || build <= CURRENT) return false;
      localStorage.setItem(KEY_ATTEMPT, String(build));
      document.open();
      document.write(html);
      document.close();
      return true;
    } catch {}
    return false;
  };

  const checkForUpdate = async (baseline = CURRENT) => {
    try {
      const response = await fetch(`${MANIFEST_URL}?t=${Date.now()}`, { cache: 'no-store' });
      if (!response.ok) return;
      const manifest = await response.json();
      const remoteBuild = Number(manifest.build || 0);
      // When a cached OTA payload is already active, compare against its build.
      if (!remoteBuild || remoteBuild <= baseline) return;
      const htmlResponse = await fetch(`${BUILD_URL}?t=${Date.now()}`, { cache: 'no-store' });
      if (!htmlResponse.ok) return;
      const html = await htmlResponse.text();
      if (!html.includes(`window.__RESUMATE_BUILD__ = ${remoteBuild};`)) return;
      if (!html.includes('')) return;
      if (manifest.sha256) {
        const actual = await digest(html);
        if (actual && actual !== manifest.sha256) return;
      }

      const oldHtml = localStorage.getItem(KEY_HTML);
      if (!oldHtml) localStorage.setItem(KEY_PREVIOUS, document.documentElement.outerHTML);
      localStorage.setItem(KEY_HTML, html);
      localStorage.setItem(KEY_BUILD, String(remoteBuild));
      localStorage.setItem(KEY_PENDING, String(remoteBuild));
      localStorage.removeItem(KEY_ATTEMPT);

      // Alert first so an OTA update is visibly/audibly acknowledged before
      // the cached payload is activated. The native Android plugin rings for
      // 8 seconds and applies a vibration pattern; browser fallback vibrates.
      await alertForUpdate(remoteBuild);
      setTimeout(() => location.reload(), 8000);
    } catch {}
  };

  window.__RESUMATE_OTA_READY__ = () => {
    try {
      sessionStorage.setItem(BOOT_OK, '1');
      localStorage.removeItem(KEY_PENDING);
      localStorage.removeItem(KEY_ATTEMPT);
      localStorage.removeItem(KEY_PREVIOUS);
    } catch {}
  };

  if (rollbackPending()) return;

  if (activateCached()) {
    const cachedBuild = getCachedBuild();
    setTimeout(() => { void checkForUpdate(cachedBuild); }, 1200);
    return;
  }
  void checkForUpdate(CURRENT);
})();

</script>

  'Line','Mosaic','Nexus','Oak','Pulse','Quill','Relay','Sage','Tempo','Union',

 const source=input&&typeof input==='object'?input:{};

let design={...designDefaults,...savedDesign};

function dirty(){const el=document.querySelector('.save-inline');if(el)el.textContent='Saving…';renderAllVisible();clearTimeout(saveTimer);saveTimer=setTimeout(save,350)}
function toast(msg){const t=document.getElementById('toast');if(!t)return;t.textContent=msg;t.classList.add('show');clearTimeout(window.__rmToast);window.__rmToast=setTimeout(()=>t.classList.remove('show'),1800)}
function templateFor(id){return window.TEMPLATES?.find(t=>Number(t.id)===Number(id))||window.TEMPLATES?.[0]}

function paperHTML(templateId,targetClass='resume-paper'){
 const t=templateFor(templateId);const p=state.personal;const contact=[p.phone,p.email,p.location,p.website].filter(Boolean).map(esc).join(' · ');const photo=p.photo?`<img class="photo" src="${esc(p.photo)}" alt="Profile photo">`:'';const hero=`<div class="hero">${photo}<h1>${esc(p.name||'Your Name')}</h1><div class="title">${esc(p.title||'Professional Title')}</div>${contact?`<div class="contact">${contact}</div>`:''}</div>`;const section=(title,body)=>body?`<section class="section"><div class="section-title">${esc(title)}</div>${body}</section>`:'';const bullets=v=>{const a=lines(v);return a.length?`<ul>${a.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:''};
 let main='';

 const projects=state.projects.filter(x=>x.name||x.description).map(x=>`<div class="exp"><div class="job">${esc(x.name)}</div>${x.technologies?`<div class="company">${esc(x.technologies)}</div>`:''}${x.description?`<p>${esc(x.description)}</p>`:''}</div>`).join('');main+=section('Projects',projects);
 const cert=state.certifications.filter(x=>x.name).map(x=>`<div class="exp"><div class="job">${esc(x.name)}</div><div class="company">${esc(x.issuer)}${x.year?` · ${esc(x.year)}`:''}</div></div>`).join('');main+=section('Certifications & Courses',cert);
 const ach=state.achievements.filter(x=>x.title).map(x=>`<div class="exp"><div class="job">${esc(x.title)}</div>${x.description?`<p>${esc(x.description)}</p>`:''}</div>`).join('');main+=section('Achievements & Awards',ach);
 const lang=state.languages.filter(x=>x.name).map(x=>`<span class="skill">${esc(x.name)}${x.level?` · ${esc(x.level)}`:''}</span>`).join('');main+=section('Languages',`<div class="skills">${lang}</div>`);

 const special=['sidebar','split','portfolio','timeline','two-column'].includes(t.layout);if(special){const primary=main.replace(section('Skills',`<div class="skills">${skills}</div>`),'');main=`<div class="cols"><div>${primary}</div><aside class="side">${section('Key Skills',`<div class="skills">${skills}</div>`)}</aside></div>`}

<script data-ota-inline="js/ui-integrity.js">
/* Runtime UI integrity guard. It does not replace the app controller; it protects the rendered shell. */
(() => {
  'use strict';
  const screenIds=['homeScreen','templatesScreen','templateDetailScreen','editorScreen','myResumesScreen','aiScreen','suggestionsScreen','premiumScreen','profileScreen'];
  const navNames=['home','templates','ai','profile'];
  const navFor={home:'homeScreen',templates:'templatesScreen',ai:'aiScreen',profile:'profileScreen'};

  function dedupeIds(){
    const seen=new Set();
    document.querySelectorAll('[id]').forEach(el=>{
      if(!el.id)return;
      if(seen.has(el.id)) el.removeAttribute('id'); else seen.add(el.id);
    });
  }

  function enforceScreens(){
    const screens=screenIds.map(id=>document.getElementById(id)).filter(Boolean);
    if(!screens.length)return;
    const active=screens.filter(s=>s.classList.contains('active'));
    if(active.length!==1){
      screens.forEach(s=>s.classList.remove('active'));
      (active[0]||document.getElementById('homeScreen')||screens[0]).classList.add('active');
    }
    const current=screens.find(s=>s.classList.contains('active'));
    const key=Object.keys(navFor).find(k=>navFor[k]===current?.id);
    document.querySelectorAll('.bottom-nav [data-nav]').forEach(btn=>{
      btn.classList.toggle('active',btn.dataset.nav===key);
      btn.setAttribute('aria-current',btn.dataset.nav===key?'page':'false');
    });
  }

  function repairNav(){
    document.querySelectorAll('.bottom-nav [data-nav]').forEach(btn=>{
      const name=btn.dataset.nav;
      if(!navNames.includes(name))btn.remove();
      if(!btn.getAttribute('aria-label'))btn.setAttribute('aria-label',`${name} screen`);
    });
  }

  function repairButtons(){
    document.querySelectorAll('button').forEach(btn=>{
      if(!btn.type)btn.type='button';
      const text=(btn.textContent||'').replace(/\s+/g,' ').trim();
      if(!btn.getAttribute('aria-label') && !text){
        const action=btn.dataset.action||btn.dataset.nav;
        if(action)btn.setAttribute('aria-label',action.replace(/[-_]/g,' '));
      }
    });
  }

  function removeAccidentalDuplicateCards(){
    document.querySelectorAll('.screen.active [data-unique]').forEach(el=>{
      const key=el.getAttribute('data-unique');
      if(!key)return;
      const same=[...document.querySelectorAll(`.screen.active [data-unique="${CSS.escape(key)}"]`)];
      same.slice(1).forEach(x=>x.remove());
    });
  }

  function run(){
    dedupeIds();
    repairNav();
    repairButtons();
    enforceScreens();
    removeAccidentalDuplicateCards();
    document.documentElement.classList.add('ui-integrity-ready');
  }

  window.addEventListener('DOMContentLoaded',run,{once:true});
  const root=document.getElementById('screenRoot');
  if(root){
    new MutationObserver(()=>{
      requestAnimationFrame(()=>{repairButtons();enforceScreens();removeAccidentalDuplicateCards();});
    }).observe(root,{subtree:true,childList:true,attributes:true,attributeFilter:['class']});
  }
})();

</script>

<script data-ota-inline="js/template-direct-preview.js">
/* Direct template selection -> Preview. Keeps the existing editor UI and skips the intermediate detail screen. */
(() => {
  'use strict';

  document.addEventListener('click', event => {
    const card = event.target.closest('[data-template-detail]');
    if (!card) return;

    // The core app currently opens the template-detail screen for this click.
    // Intercept it before the core bubble listener and route the same template
    // through the existing "Use This Template" action, which opens Preview.
    event.preventDefault();
    event.stopImmediatePropagation();

    const id = Number(card.dataset.templateDetail) || 1;
    setTimeout(() => {
      const action = document.createElement('button');
      action.type = 'button';
      action.hidden = true;
      action.dataset.action = 'use-template';
      action.dataset.id = String(id);
      document.body.appendChild(action);
      action.click();
      action.remove();
    }, 0);
  }, true);
})();

</script>
<script data-ota-inline="js/preview-fullscreen-controls.js">
/* Permanently remove the legacy editor controls from the entire app. */
(() => {
  'use strict';

  const CONTROL_RE = /^(add\s+section|reorder|font(?:\s+style)?|style|color|edit\s+content|download\s+pdf|export\s+pdf)$/i;
  const LABEL_RE = /add\s+section|reorder|font\s*(style)?|edit\s+content|download\s+pdf|export\s+pdf/i;

  const textOf = el => String(el?.innerText || el?.textContent || '').replace(/\s+/g, ' ').trim();

  function shouldRemove(el) {
    if (!(el instanceof Element)) return false;
    if (el.closest('.app-header,.bottom-nav')) return false;
    const text = textOf(el);
    const label = String(el.getAttribute('aria-label') || el.getAttribute('title') || '').trim();
    return CONTROL_RE.test(text) || LABEL_RE.test(label);
  }

  function removeLegacyControls() {
    document.querySelectorAll('button,a,[role="button"],[role="tab"],select').forEach(el => {
      if (shouldRemove(el)) {
        const wrapper = el.closest('.field-row,.toolbar-item,.control-item,.editor-action,.action-item');
        if (wrapper && wrapper !== document.body && wrapper !== document.documentElement) wrapper.remove();
        else el.remove();
      }
    });
  }

  // Run globally so the controls cannot reappear when navigating between screens.
  removeLegacyControls();
  const observer = new MutationObserver(() => removeLegacyControls());
  observer.observe(document.body, { childList: true, subtree: true });
})();

</script>
<script data-ota-inline="js/template-label-integrity.js">
/* Preview/template label integrity: consistent title casing and no legacy Change control. */
(() => {
  'use strict';

  const titleCase = value => String(value || '').trim().replace(/\b([a-z])([a-z0-9]*)\b/gi, (_, a, b) => a.toUpperCase() + b.toLowerCase());
  const templateRoots = () => [document.querySelector('#templatesScreen'), document.querySelector('#templateDetailScreen')].filter(Boolean);

  const normalizeTemplateLabels = root => {
    root.querySelectorAll('[data-template-name], .template-name, .template-title, .template-label, .template-card-title').forEach(el => {
      const text = String(el.textContent || '').trim();
      const match = text.match(/^(\d{1,3})\s*[-:.]?\s*(.+)$/);
      if (match) el.textContent = `${String(Number(match[1])).padStart(2, '0')} ${titleCase(match[2])}`;
      else if (text) el.textContent = titleCase(text);
    });
  };

  const removeLegacyChange = root => {
    root.querySelectorAll('button,a,[role="button"]').forEach(el => {
      if (String(el.textContent || '').replace(/\s+/g, ' ').trim().toLowerCase() !== 'change') return;
      const wrapper = el.closest('.field-row,.toolbar-item,.control-item,.editor-action,.action-row,.action-item');
      (wrapper || el).remove();
    });
  };

  const run = () => templateRoots().forEach(root => {
    normalizeTemplateLabels(root);
    removeLegacyChange(root);
  });

  run();
  new MutationObserver(run).observe(document.body, {childList:true, subtree:true});
})();

</script>
<script data-ota-inline="js/template-filters-search-fix.js">
/* Stable Templates filtering/search interaction layer. Keeps the approved UI unchanged. */
(() => {
  'use strict';

  const CATEGORIES = ['Modern', 'Professional', 'Minimal', 'Creative', 'Simple'];
  let activeCategory = 'All';
  let searchTerm = '';
  let applyTimer = 0;

  const normalize = value => String(value || '').trim().toLowerCase();

  // Match the app's own templateCategory() logic exactly.
  function categoryFor(template) {
    const layout = normalize(template?.layout);
    if (['sidebar', 'split', 'two-column', 'timeline'].includes(layout)) return 'Professional';
    if (['editorial', 'elegant', 'magazine'].includes(layout)) return 'Creative';
    if (['minimal', 'ats', 'mono'].includes(layout)) return 'Minimal';
    return Number(template?.id) % 2 ? 'Modern' : 'Simple';
  }

  function root() {
    return document.getElementById('templatesScreen');
  }

  function input() {
    return document.getElementById('templateSearch');
  }

  function cards() {
    const r = root();
    return r ? [...r.querySelectorAll('.template-card')] : [];
  }

  function applyFilters() {
    const templates = window.TEMPLATES || [];
    const q = normalize(searchTerm);

    cards().forEach(card => {
      const trigger = card.querySelector('[data-template-detail]');
      const id = Number(trigger?.dataset.templateDetail || 0);
      const template = templates.find(t => Number(t.id) === id);
      if (!template) {
        card.hidden = true;
        card.style.display = 'none';
        return;
      }

      const category = categoryFor(template);
      const haystack = normalize([template.name, template.layout, category].join(' '));
      const categoryMatch = activeCategory === 'All' || category === activeCategory;
      const searchMatch = !q || haystack.includes(q);
      const visible = categoryMatch && searchMatch;

      card.hidden = !visible;
      card.style.display = visible ? '' : 'none';
    });

    const r = root();
    if (r) {
      r.querySelectorAll('#templateScreenCats .chip').forEach(chip => {
        const selected = (chip.dataset.cat || 'All') === activeCategory;
        chip.classList.toggle('active', selected);
        chip.setAttribute('aria-pressed', selected ? 'true' : 'false');
      });
    }
  }

  function syncFromRenderedScreen() {
    const r = root();
    const i = input();
    if (!r || !i) return;

    // The app may recreate this input when navigating back to Templates.
    i.setAttribute('enterkeyhint', 'search');
    i.setAttribute('autocomplete', 'off');
    if (i.value !== searchTerm) i.value = searchTerm;
    applyFilters();
  }

  function scheduleApply() {
    clearTimeout(applyTimer);
    applyTimer = setTimeout(syncFromRenderedScreen, 0);
  }

  // Capture BEFORE app.js's bubbling input listener. app.js currently rerenders the
  // whole Templates screen on every input, which destroys focus and the mobile IME.
  document.addEventListener('input', event => {
    const target = event.target;
    if (!(target instanceof HTMLInputElement) || target.id !== 'templateSearch') return;

    searchTerm = target.value;
    event.stopPropagation();
    applyFilters();
  }, true);

  // Keep the search field focused when Android/iOS sends Enter from the keyboard.
  // We intentionally do not blur or replace the input node.
  document.addEventListener('keydown', event => {
    const target = event.target;
    if (!(target instanceof HTMLInputElement) || target.id !== 'templateSearch') return;
    if (event.key !== 'Enter') return;

    if (event.isComposing || event.keyCode === 229) return;

    searchTerm = target.value;
    event.preventDefault();
    event.stopPropagation();
    applyFilters();
  }, true);

  // Category clicks are also intercepted before app.js so the app does not
  // recreate the entire screen and break a smooth mobile interaction.
  document.addEventListener('click', event => {
    const target = event.target instanceof Element ? event.target : null;
    const chip = target?.closest('#templateScreenCats [data-cat]');
    if (!chip) return;

    activeCategory = chip.dataset.cat || 'All';
    event.preventDefault();
    event.stopPropagation();
    applyFilters();
  }, true);

  window.addEventListener('DOMContentLoaded', scheduleApply, { once: true });
  new MutationObserver(scheduleApply).observe(document.documentElement, { childList: true, subtree: true });
  scheduleApply();
})();

</script>
<script data-ota-inline="js/screen-layout-fix.js">
/* ResuMate layout guard — locked header/home + guaranteed 100-template registry display. */
(() => {
  'use strict';

  const root = () => document.getElementById('screenRoot');
  const templates = () => document.getElementById('templatesScreen');
  const home = () => document.getElementById('homeScreen');

  function category(t) {
    const l = String(t?.layout || '').toLowerCase();
    if (['sidebar','split','two-column','timeline'].includes(l)) return 'Professional';
    if (['editorial','elegant','magazine'].includes(l)) return 'Creative';
    if (['minimal','ats','mono'].includes(l)) return 'Minimal';
    return Number(t?.id) % 2 ? 'Modern' : 'Simple';
  }

  function syncHome() {
    const r = root();
    const h = home();
    if (!r || !h) return;
    if (h.classList.contains('active')) {
      r.scrollTop = 0;
      r.style.overflowY = 'hidden';
      r.style.touchAction = 'none';
      h.style.overflow = 'hidden';
      h.style.touchAction = 'none';
    } else {
      r.style.overflowY = 'auto';
      r.style.touchAction = 'pan-y';
      h.style.overflow = 'visible';
      h.style.touchAction = 'pan-y';
    }
  }

  function ensure100() {
    const screen = templates();
    const all = Array.isArray(window.TEMPLATES) ? window.TEMPLATES : [];
    if (!screen || all.length < 100 || !screen.classList.contains('active')) return;
    const grid = screen.querySelector('.template-grid');
    if (!grid) return;

    const byId = new Map([...grid.querySelectorAll('[data-template-detail]')]
      .map(el => [Number(el.dataset.templateDetail), el]));
    let seed = grid.querySelector('.template-card');
    if (!seed) return;

    all.slice(0, 100).forEach(t => {
      if (byId.has(Number(t.id))) return;
      const card = seed.cloneNode(true);
      card.dataset.templateDetail = String(t.id);
      card.setAttribute('data-template-id', String(t.id));
      card.classList.remove('active', 'selected');
      const title = card.querySelector('.template-name, .template-title, h3, h4, strong');
      if (title) title.textContent = t.name;
      const categoryEl = card.querySelector('.template-category');
      if (categoryEl) categoryEl.textContent = category(t);
      const numberEl = card.querySelector('[data-template-number], .template-number');
      if (numberEl) numberEl.textContent = String(t.id).padStart(2, '0');
      const preview = card.querySelector('.mini-paper');
      if (preview) {
        preview.style.setProperty('--accent', t.color || '#6b2d1f');
        preview.style.setProperty('--wash', t.wash || '#f2e7d5');
        preview.style.setProperty('--font', t.font || 'Arial');
        const top = preview.querySelector('.mini-top');
        if (top) top.textContent = String(t.id).padStart(2, '0') + ' ' + t.name.replace(/^\d+\s*/, '');
      }
      grid.appendChild(card);
      byId.set(Number(t.id), card);
    });

    const search = String(screen.querySelector('#templateSearch')?.value || '').trim().toLowerCase();
    const active = screen.querySelector('#templateScreenCats .chip.active')?.dataset.cat || 'All';
    [...grid.querySelectorAll('[data-template-detail]')].forEach(card => {
      const id = Number(card.dataset.templateDetail);
      const t = all.find(x => Number(x.id) === id);
      if (!t) return;
      const hay = `${t.name} ${t.family} ${t.layout} ${category(t)}`.toLowerCase();
      const matchesSearch = !search || hay.includes(search);
      const matchesCategory = !active || active === 'All' || category(t) === active;
      card.hidden = !(matchesSearch && matchesCategory);
    });
  }

  function sync() {
    syncHome();
    ensure100();
  }

  const observer = new MutationObserver(() => requestAnimationFrame(sync));
  observer.observe(document.body, { childList: true, subtree: true, attributes: true, attributeFilter: ['class'] });
  document.addEventListener('click', () => setTimeout(sync, 0), true);
  document.addEventListener('input', e => {
    if (e.target?.id === 'templateSearch') setTimeout(sync, 0);
  }, true);
  window.addEventListener('resize', sync, { passive: true });
  requestAnimationFrame(sync);
})();

</script>
<script data-ota-inline="js/premium-template-gallery.js">
/* Premium animated template gallery. Scoped to #templatesScreen only. */
(() => {
  'use strict';
  const reduceMotion = () => window.matchMedia?.('(prefers-reduced-motion: reduce)').matches;

  function modal() {
    let el = document.getElementById('resumateGalleryModal');
    if (el) return el;
    el = document.createElement('div');
    el.id = 'resumateGalleryModal';
    el.innerHTML = '<div class="gallery-modal-box" role="dialog" aria-modal="true" aria-label="Template quick preview"><div class="gallery-modal-head"><span class="gallery-modal-title">Template preview</span><button class="gallery-modal-close" type="button" aria-label="Close preview">×</button></div><div class="gallery-modal-preview"></div><div class="gallery-modal-copy">Quick preview. Use the existing template card action to open the full ResuMate editor/preview flow.</div></div>';
    document.body.appendChild(el);
    const close = () => el.classList.remove('is-open');
    el.querySelector('.gallery-modal-close').addEventListener('click', close);
    el.addEventListener('click', e => { if (e.target === el) close(); });
    document.addEventListener('keydown', e => { if (e.key === 'Escape') close(); });
    return el;
  }

  function enhance() {
    const screen = document.getElementById('templatesScreen');
    if (!screen || !screen.classList.contains('active')) return;
    const cards = screen.querySelectorAll('.template-card');
    cards.forEach((card, index) => {
      if (card.dataset.galleryEnhanced === 'true') return;
      card.dataset.galleryEnhanced = 'true';
      if (index < 5) card.dataset.premiumFeatured = 'true';

      const host = card.querySelector('button');
      const preview = card.querySelector('.template-preview');
      if (!host || !preview) return;

      const shine = document.createElement('span');
      shine.className = 'gallery-shine';
      host.appendChild(shine);

      const detail = document.createElement('span');
      detail.className = 'gallery-detail';
      detail.textContent = 'Quick preview';
      host.appendChild(detail);

      if (!reduceMotion()) {
        card.addEventListener('pointermove', e => {
          if (e.pointerType === 'touch') return;
          const r = card.getBoundingClientRect();
          const x = (e.clientX - r.left) / r.width;
          const y = (e.clientY - r.top) / r.height;
          const rx = (0.5 - y) * 6;
          const ry = (x - 0.5) * 8;
          card.style.transform = `perspective(900px) rotateX(${rx}deg) rotateY(${ry}deg) translateY(-4px)`;
          preview.style.setProperty('--gallery-x', `${x * 100}%`);
          preview.style.setProperty('--gallery-y', `${y * 100}%`);
        });
        card.addEventListener('pointerleave', () => { card.style.transform = ''; });
      }

      // Desktop quick-preview: Alt/Option + click. Normal click keeps the app's existing template flow.
      host.addEventListener('click', e => {
        if (!e.altKey) return;
        e.preventDefault();
        e.stopImmediatePropagation();
        const m = modal();
        m.querySelector('.gallery-modal-title').textContent = card.querySelector('.template-meta b')?.textContent || 'Template preview';
        const target = m.querySelector('.gallery-modal-preview');
        target.innerHTML = '';
        const clone = preview.cloneNode(true);
        clone.querySelectorAll('[data-template-detail]').forEach(x => x.removeAttribute('data-template-detail'));
        target.appendChild(clone);
        m.classList.add('is-open');
      }, true);
    });
  }

  const observer = new MutationObserver(() => requestAnimationFrame(enhance));
  const start = () => {
    const root = document.getElementById('screenRoot') || document.body;
    observer.observe(root, { childList: true, subtree: true });
    enhance();
  };
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start, { once: true });
  else start();
})();

</script>
